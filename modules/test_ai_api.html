<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار API الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-4">🧪 اختبار API الذكاء الاصطناعي</h1>

        <div class="space-y-4">
            <button onclick="testGetQuestions()" class="bg-blue-600 text-white px-4 py-2 rounded">
                اختبار: تحميل أسئلة الميزانية العامة
            </button>

            <button onclick="testGetQuestionsCommittee()" class="bg-purple-600 text-white px-4 py-2 rounded">
                اختبار: تحميل أسئلة ميزانية اللجنة
            </button>
        </div>

        <div class="mt-6">
            <h3 class="font-bold mb-2">النتائج:</h3>
            <pre id="results" class="bg-gray-100 p-4 rounded overflow-auto max-h-96"></pre>
        </div>
    </div>

    <script>
        function displayResult(title, data) {
            const results = document.getElementById('results');
            results.textContent = `${title}\n\n${JSON.stringify(data, null, 2)}`;
        }

        async function testGetQuestions() {
            try {
                const response = await fetch('../api/ai_budget_generate.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'get_questions',
                        budget_type: 'general'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                displayResult('✅ نجح - أسئلة الميزانية العامة', data);

            } catch (error) {
                displayResult('❌ فشل', { error: error.message });
            }
        }

        async function testGetQuestionsCommittee() {
            try {
                const response = await fetch('../api/ai_budget_generate.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'get_questions',
                        budget_type: 'committee'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                displayResult('✅ نجح - أسئلة ميزانية اللجنة', data);

            } catch (error) {
                displayResult('❌ فشل', { error: error.message });
            }
        }
    </script>
</body>
</html>
